server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The trailing slash deliberately removes /api before forwarding to FastAPI,
    # whose public endpoints are rooted at /books, /chat, and similar paths.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # A rebuilt image can reference new hashed bundles. Revalidate the shell on
    # every navigation so a browser does not retain an old entry document that
    # points at bundles removed by the deployment.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite fingerprints production assets, so they can be cached indefinitely
    # without keeping a previous SPA shell alive.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

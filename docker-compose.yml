services:
  # This one-shot service is the required bridge from the user-owned JSON file
  # to non-secret Docker service wiring. Run scripts/start_local.sh or
  # scripts/start_local.ps1; direct `docker compose up` intentionally fails at
  # API startup when config/librarian.json has not been created.
  config-resolver:
    profiles:
      - config-resolver
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: config-resolver
    volumes:
      - ./config:/config:ro
      - ./.runtime:/output
    command:
      - --config
      - /config/librarian.json
      - --compose-output
      - /output/librarian.compose.json
      - --state-output
      - /output/librarian.state.json

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      bootstrap.memory_lock: "false"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama:
    profiles:
      - docker-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60

  ollama-init:
    profiles:
      - docker-ollama
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_INIT_MODELS: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        old_ifs="$$IFS"
        IFS=,
        for model in $$OLLAMA_INIT_MODELS; do
          if [ -n "$$model" ]; then
            ollama pull "$$model"
          fi
        done
        IFS="$$old_ifs"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    volumes:
      - ./config:/config:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  summary-worker:
    profiles:
      - workers
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - python
      - scripts/process_summary_jobs.py
      - --watch
      - --limit
      - "1"
      - --poll-interval-seconds
      - "10"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch-data:
  ollama-models:

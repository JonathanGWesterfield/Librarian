services:
  opensearch:
    ports: !reset []
    volumes:
      - verify-opensearch-data:/usr/share/opensearch/data

  config-resolver:
    volumes:
      - ./tests/fixtures/config:/config:ro
      - ./.runtime/verification:/output
    command:
      - --config
      - /config/librarian.json
      - --no-host-ports
      - --compose-output
      - /output/librarian.compose.json
      - --state-output
      - /output/librarian.state.json

  api:
    ports: !reset []
    volumes:
      - verify-data:/data
      - ./tests/fixtures/epubs:/books:ro
      - ./tests/fixtures/config:/config:ro

  web:
    ports: !reset []

  verifier:
    profiles:
      - verify
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    command:
      - python
      - scripts/verify_compose.py
      - --api-url
      - http://api:8000
      - --books-dir
      - /books
      - --database-url
      - sqlite:////verify-data/librarian.db
      - --opensearch-url
      - http://opensearch:9200
      - --ollama-base-url
      - http://ollama:11434
    volumes:
      - verify-data:/verify-data
      - ./tests/fixtures/config:/config:ro
    depends_on:
      api:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  verify-data:
  verify-opensearch-data:

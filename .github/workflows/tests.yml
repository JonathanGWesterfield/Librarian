name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install -e "packages[dev]" -e "apps/api[dev]"

      - name: Build runtime image target
        run: docker build -f apps/api/Dockerfile --target runtime -t librarian-runtime:${{ github.sha }} .

      - name: Build test image target
        run: docker build -f apps/api/Dockerfile --target test -t librarian-test:${{ github.sha }} .

      - name: Run checks
        run: scripts/check.sh

      - name: Prepare base evaluation report
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:docs/evaluation-retrieval-report.json" > /tmp/librarian-base-evaluation-report.json || true

      - name: Publish evaluation summary
        run: python scripts/evaluate_retrieval.py --check --github-summary "$GITHUB_STEP_SUMMARY" --compare-to /tmp/librarian-base-evaluation-report.json

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            docs/evaluation-retrieval-report.json
            docs/evaluation-report.md

  compose-verification:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Docker VM capacity
        run: scripts/verify_preflight.sh --minimum-gb 4

      - name: Run runtime API Compose verification
        run: scripts/run_compose_verification.sh
